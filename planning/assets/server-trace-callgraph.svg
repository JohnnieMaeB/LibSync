<svg viewBox="0 0 1900 830" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif" role="img" aria-label="Runtime call graph of the LibSync backend from each of its five HTTP endpoints down through router handlers, the session store, the PydanticAI agent's run methods, the shared tool-calling loop with its four tools, the five backing services, and the five external systems they call.">
  <defs>
    <marker id="cg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666666"/>
    </marker>
    <marker id="cg-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8a83c"/>
    </marker>
  </defs>
  <rect width="1900" height="830" fill="#121212"/>

  <text x="24" y="30" fill="#f0f0f0" font-size="16" font-weight="700">Runtime call graph — every endpoint's path through the codebase</text>

  <!-- ============ ROW 1: HTTP entry points ============ -->
  <g font-size="12" font-weight="600" fill="#f0f0f0">
    <rect x="40" y="60" width="260" height="50" rx="8" fill="#2a2a2a" stroke="#e8735c" stroke-width="1.5"/>
    <text x="56" y="82" fill="#e8735c">GET /citation/{doi}</text>
    <text x="56" y="98" fill="#aaaaaa" font-size="9.5" font-weight="400">style switcher</text>

    <rect x="330" y="60" width="280" height="50" rx="8" fill="#2a2a2a" stroke="#ffd166" stroke-width="1.5"/>
    <text x="346" y="82" fill="#ffd166">POST /agent</text>
    <text x="346" y="98" fill="#aaaaaa" font-size="9.5" font-weight="400">AG-UI transport, primary</text>

    <rect x="640" y="60" width="280" height="50" rx="8" fill="#2a2a2a" stroke="#7cc48f" stroke-width="1.5"/>
    <text x="656" y="82" fill="#7cc48f">POST /chat</text>
    <text x="656" y="98" fill="#aaaaaa" font-size="9.5" font-weight="400">fallback transport</text>

    <rect x="950" y="60" width="280" height="50" rx="8" fill="#2a2a2a" stroke="#6ea8fe" stroke-width="1.5"/>
    <text x="966" y="82" fill="#6ea8fe">POST /chat/stream</text>
    <text x="966" y="98" fill="#aaaaaa" font-size="9.5" font-weight="400">fallback transport</text>

    <rect x="1260" y="60" width="260" height="50" rx="8" fill="#2a2a2a" stroke="#b98cf2" stroke-width="1.5"/>
    <text x="1276" y="82" fill="#b98cf2">POST /api/query</text>
    <text x="1276" y="98" fill="#aaaaaa" font-size="9.5" font-weight="400">direct Pinecone, no LLM</text>
  </g>

  <!-- ============ ROW 2: router handler functions ============ -->
  <g font-size="11.5" fill="#f0f0f0">
    <rect x="40" y="160" width="260" height="50" rx="8" fill="#1e1e1e" stroke="#333333"/>
    <text x="56" y="182">citation_style_switch()</text>
    <text x="56" y="198" fill="#797979" font-size="9.5">routers/agent.py</text>

    <rect x="330" y="160" width="280" height="50" rx="8" fill="#1e1e1e" stroke="#333333"/>
    <text x="346" y="182">agent_endpoint()</text>
    <text x="346" y="198" fill="#797979" font-size="9.5">routers/agent.py</text>

    <rect x="640" y="160" width="280" height="50" rx="8" fill="#1e1e1e" stroke="#333333"/>
    <text x="656" y="182">chat() · _parse_chat_request()</text>
    <text x="656" y="198" fill="#797979" font-size="9.5">routers/chat.py</text>

    <rect x="950" y="160" width="280" height="50" rx="8" fill="#1e1e1e" stroke="#333333"/>
    <text x="966" y="182">chat_stream() · _parse_chat_request()</text>
    <text x="966" y="198" fill="#797979" font-size="9.5">routers/chat.py</text>

    <rect x="1260" y="160" width="260" height="50" rx="8" fill="#1e1e1e" stroke="#333333"/>
    <text x="1276" y="182">query()</text>
    <text x="1276" y="198" fill="#797979" font-size="9.5">routers/pinecone_query.py</text>
  </g>
  <!-- row1 -> row2 straight arrows -->
  <line x1="170" y1="110" x2="170" y2="160" stroke="#e8735c" stroke-width="1.5" marker-end="url(#cg-arrow)"/>
  <line x1="470" y1="110" x2="470" y2="160" stroke="#ffd166" stroke-width="1.5" marker-end="url(#cg-arrow)"/>
  <line x1="780" y1="110" x2="780" y2="160" stroke="#7cc48f" stroke-width="1.5" marker-end="url(#cg-arrow)"/>
  <line x1="1090" y1="110" x2="1090" y2="160" stroke="#6ea8fe" stroke-width="1.5" marker-end="url(#cg-arrow)"/>
  <line x1="1390" y1="110" x2="1390" y2="160" stroke="#b98cf2" stroke-width="1.5" marker-end="url(#cg-arrow)"/>

  <!-- ============ session_store (fed by col2,3,4) ============ -->
  <rect x="640" y="228" width="280" height="46" rx="8" fill="#1e1e1e" stroke="#ffd166" stroke-width="1"/>
  <text x="656" y="248" fill="#f0f0f0" font-size="11.5" font-weight="600">session_store</text>
  <text x="656" y="264" fill="#aaaaaa" font-size="9.5">.get() before run · .append() after</text>
  <path d="M470,210 Q560,225 655,240" stroke="#ffd166" stroke-width="1.3" fill="none" marker-end="url(#cg-arrow)"/>
  <line x1="780" y1="210" x2="780" y2="228" stroke="#7cc48f" stroke-width="1.3" marker-end="url(#cg-arrow)"/>
  <path d="M1090,210 Q1000,225 925,240" stroke="#6ea8fe" stroke-width="1.3" fill="none" marker-end="url(#cg-arrow)"/>

  <!-- ============ ROW 3: agent entry wrappers ============ -->
  <g font-size="11.5" fill="#f0f0f0">
    <rect x="330" y="300" width="280" height="46" rx="8" fill="#1e1e1e" stroke="#333333"/>
    <text x="346" y="320">AGUIAdapter.run_stream()</text>
    <text x="346" y="336" fill="#797979" font-size="9.5">library code, agent.py's chat_agent</text>

    <rect x="640" y="300" width="280" height="46" rx="8" fill="#1e1e1e" stroke="#333333"/>
    <text x="656" y="320">get_chat_reply()</text>
    <text x="656" y="336" fill="#797979" font-size="9.5">app/agent.py</text>

    <rect x="950" y="300" width="280" height="46" rx="8" fill="#1e1e1e" stroke="#333333"/>
    <text x="966" y="320">stream_chat_reply()</text>
    <text x="966" y="336" fill="#797979" font-size="9.5">app/agent.py</text>
  </g>
  <line x1="470" y1="210" x2="470" y2="300" stroke="#ffd166" stroke-width="1.3" marker-end="url(#cg-arrow)" stroke-dasharray="1 0"/>
  <line x1="780" y1="274" x2="780" y2="300" stroke="#7cc48f" stroke-width="1.3" marker-end="url(#cg-arrow)"/>
  <line x1="1090" y1="210" x2="1090" y2="300" stroke="#6ea8fe" stroke-width="1.3" marker-end="url(#cg-arrow)"/>

  <!-- ============ ROW 3.5: chat_agent entry methods ============ -->
  <g font-size="11.5" fill="#f0f0f0">
    <rect x="330" y="372" width="280" height="46" rx="8" fill="#1e1e1e" stroke="#ffd166" stroke-width="1"/>
    <text x="346" y="392">chat_agent.run_stream_events()</text>
    <text x="346" y="408" fill="#797979" font-size="9.5">used by /agent AND /chat/stream</text>

    <rect x="640" y="372" width="280" height="46" rx="8" fill="#1e1e1e" stroke="#333333"/>
    <text x="656" y="392">chat_agent.run()</text>
    <text x="656" y="408" fill="#797979" font-size="9.5">used by /chat only</text>
  </g>
  <line x1="470" y1="346" x2="470" y2="372" stroke="#ffd166" stroke-width="1.3" marker-end="url(#cg-arrow)"/>
  <path d="M1090,346 C1090,362 720,352 615,384" stroke="#6ea8fe" stroke-width="1.3" fill="none" marker-end="url(#cg-arrow)"/>
  <line x1="780" y1="346" x2="780" y2="372" stroke="#7cc48f" stroke-width="1.3" marker-end="url(#cg-arrow)"/>

  <!-- ============ ROW 4: tool-calling loop container ============ -->
  <rect x="300" y="440" width="650" height="150" rx="10" fill="none" stroke="#555555" stroke-dasharray="5 4"/>
  <text x="316" y="458" fill="#aaaaaa" font-size="10.5" font-weight="600">Tool-calling loop (PydanticAI ↔ Groq/HF) — see §3</text>

  <g font-size="10.5" fill="#f0f0f0" font-weight="600">
    <rect x="317" y="470" width="145" height="50" rx="6" fill="#2a2a2a" stroke="#333333"/>
    <text x="327" y="490">lookup_and_cite()</text>
    <text x="327" y="506" fill="#aaaaaa" font-size="9" font-weight="400">Crossref+citeproc</text>

    <rect x="474" y="470" width="145" height="50" rx="6" fill="#2a2a2a" stroke="#333333"/>
    <text x="484" y="490">search_scholarly</text>
    <text x="484" y="502" fill="#f0f0f0" font-size="10.5" font-weight="600">_works()</text>
    <text x="484" y="516" fill="#aaaaaa" font-size="9" font-weight="400">OpenAlex</text>

    <rect x="631" y="470" width="145" height="50" rx="6" fill="#2a2a2a" stroke="#333333"/>
    <text x="641" y="490">search_catalog()</text>
    <text x="641" y="506" fill="#aaaaaa" font-size="9" font-weight="400">Open Library</text>

    <rect x="788" y="470" width="145" height="50" rx="6" fill="#2a2a2a" stroke="#333333"/>
    <text x="798" y="490">search_library</text>
    <text x="798" y="502" fill="#f0f0f0" font-size="10.5" font-weight="600">_policies()</text>
    <text x="798" y="516" fill="#aaaaaa" font-size="9" font-weight="400">Pinecone</text>
  </g>

  <rect x="1000" y="465" width="260" height="60" rx="8" fill="#1e1e1e" stroke="#ffd166" stroke-width="1"/>
  <text x="1016" y="488" fill="#ffd166" font-size="11.5" font-weight="600">Groq (primary) → HF (fallback)</text>
  <text x="1016" y="504" fill="#aaaaaa" font-size="9.5">llama-3.3-70b · DeepSeek-V3.2/novita</text>
  <path d="M950,495 L1000,495" stroke="#666666" stroke-width="1.3" marker-end="url(#cg-arrow)"/>
  <path d="M1000,510 L950,510" stroke="#666666" stroke-width="1.3" marker-end="url(#cg-arrow)"/>

  <line x1="470" y1="418" x2="470" y2="440" stroke="#ffd166" stroke-width="1.3" marker-end="url(#cg-arrow)"/>
  <line x1="780" y1="418" x2="780" y2="440" stroke="#7cc48f" stroke-width="1.3" marker-end="url(#cg-arrow)"/>

  <!-- ============ ROW 5: services ============ -->
  <g font-size="11.5" fill="#f0f0f0" font-weight="600">
    <rect x="275" y="612" width="250" height="55" rx="8" fill="#1e1e1e" stroke="#333333"/>
    <text x="291" y="634">citation_service</text>
    <text x="291" y="650" fill="#aaaaaa" font-size="9.5" font-weight="400">format_citation()</text>

    <rect x="550" y="612" width="250" height="55" rx="8" fill="#1e1e1e" stroke="#333333"/>
    <text x="566" y="634">crossref_service</text>
    <text x="566" y="650" fill="#aaaaaa" font-size="9.5" font-weight="400">lookup_work() — 300s cache</text>

    <rect x="825" y="612" width="250" height="55" rx="8" fill="#1e1e1e" stroke="#333333"/>
    <text x="841" y="634">openalex_service</text>
    <text x="841" y="650" fill="#aaaaaa" font-size="9.5" font-weight="400">search_scholarly_works()</text>

    <rect x="1100" y="612" width="250" height="55" rx="8" fill="#1e1e1e" stroke="#333333"/>
    <text x="1116" y="634">open_library_service</text>
    <text x="1116" y="650" fill="#aaaaaa" font-size="9.5" font-weight="400">search_catalog()</text>

    <rect x="1375" y="612" width="250" height="55" rx="8" fill="#1e1e1e" stroke="#333333"/>
    <text x="1391" y="634">pinecone_service</text>
    <text x="1391" y="650" fill="#aaaaaa" font-size="9.5" font-weight="400">search_pinecone()</text>
  </g>
  <!-- tool -> service arrows -->
  <path d="M389,520 C389,560 380,590 400,612" stroke="#666666" stroke-width="1.3" fill="none" marker-end="url(#cg-arrow)"/>
  <path d="M389,520 C450,560 600,585 675,612" stroke="#666666" stroke-width="1.3" fill="none" marker-end="url(#cg-arrow)"/>
  <path d="M546,520 C620,560 850,585 950,612" stroke="#666666" stroke-width="1.3" fill="none" marker-end="url(#cg-arrow)"/>
  <path d="M703,520 C850,560 1150,585 1225,612" stroke="#666666" stroke-width="1.3" fill="none" marker-end="url(#cg-arrow)"/>
  <path d="M860,520 C1100,560 1400,585 1500,612" stroke="#666666" stroke-width="1.3" fill="none" marker-end="url(#cg-arrow)"/>

  <!-- ============ bypass trunks (left: citation switch, right: query) ============ -->
  <path d="M170,210 L170,225 L20,225 L20,595 L275,595 L275,612" stroke="#e8735c" stroke-width="1.5" fill="none" stroke-dasharray="6 3" marker-end="url(#cg-arrow-amber)"/>
  <path d="M170,210 L170,225 L20,225 L20,595 L640,595 L640,612" stroke="#e8735c" stroke-width="1.5" fill="none" stroke-dasharray="6 3" marker-end="url(#cg-arrow-amber)"/>
  <text x="24" y="418" fill="#e8735c" font-size="9.5" transform="rotate(-90 24 418)">citation_style_switch() — direct, cache-first, no LLM/tool call</text>

  <path d="M1390,210 L1390,225 L1880,225 L1880,595 L1500,595 L1500,612" stroke="#b98cf2" stroke-width="1.5" fill="none" stroke-dasharray="6 3" marker-end="url(#cg-arrow-amber)"/>
  <text x="1884" y="418" fill="#b98cf2" font-size="9.5" transform="rotate(-90 1884 418)">query() — direct, thread-offloaded, no LLM/tool call</text>

  <!-- ============ ROW 6: external systems ============ -->
  <g font-size="11.5" fill="#f0f0f0" font-weight="600">
    <rect x="275" y="702" width="250" height="46" rx="8" fill="#161616" stroke="#444444"/>
    <text x="291" y="722">citeproc-py</text>
    <text x="291" y="738" fill="#797979" font-size="9.5" font-weight="400">local, no network</text>

    <rect x="550" y="702" width="250" height="46" rx="8" fill="#161616" stroke="#444444"/>
    <text x="566" y="722">Crossref API</text>
    <text x="566" y="738" fill="#797979" font-size="9.5" font-weight="400">free, keyless, mailto=</text>

    <rect x="825" y="702" width="250" height="46" rx="8" fill="#161616" stroke="#444444"/>
    <text x="841" y="722">OpenAlex API</text>
    <text x="841" y="738" fill="#797979" font-size="9.5" font-weight="400">free, keyless, mailto=</text>

    <rect x="1100" y="702" width="250" height="46" rx="8" fill="#161616" stroke="#444444"/>
    <text x="1116" y="722">Open Library API</text>
    <text x="1116" y="738" fill="#797979" font-size="9.5" font-weight="400">free, keyless, User-Agent</text>

    <rect x="1375" y="702" width="250" height="46" rx="8" fill="#161616" stroke="#444444"/>
    <text x="1391" y="722">Pinecone index</text>
    <text x="1391" y="738" fill="#797979" font-size="9.5" font-weight="400">integrated embedding</text>
  </g>
  <line x1="400" y1="667" x2="400" y2="702" stroke="#666666" stroke-width="1.3" marker-end="url(#cg-arrow)"/>
  <line x1="675" y1="667" x2="675" y2="702" stroke="#666666" stroke-width="1.3" marker-end="url(#cg-arrow)"/>
  <line x1="950" y1="667" x2="950" y2="702" stroke="#666666" stroke-width="1.3" marker-end="url(#cg-arrow)"/>
  <line x1="1225" y1="667" x2="1225" y2="702" stroke="#666666" stroke-width="1.3" marker-end="url(#cg-arrow)"/>
  <line x1="1500" y1="667" x2="1500" y2="702" stroke="#666666" stroke-width="1.3" marker-end="url(#cg-arrow)"/>

  <text x="24" y="775" fill="#797979" font-size="10.5">Colored borders on row 1 mark each endpoint; gray arrows are shared structure any endpoint can reach. The</text>
  <text x="24" y="791" fill="#797979" font-size="10.5">dashed side paths are the two routes that skip the LLM/tool-calling loop entirely — see the Request traces below.</text>
</svg>
