<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LibSync</title>
  <link rel="stylesheet" href="./styles/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <img src="./assets/logo.png" alt="AI Assistant Logo" class="logo" />
      <div>
        <h1>LibSync</h1>
        <p class="tagline">Your personal AI library assistant.</p>
      </div>
    </header>

    <p id="capabilityLine" class="capability-line">
      I can search the catalog, find research papers, and format citations — just ask.
      <button type="button" id="capabilityDismiss" class="capability-dismiss" aria-label="Dismiss">&times;</button>
    </p>

    <main id="chatBox" role="log" aria-live="polite" aria-relevant="additions">
      <div class="bot intro">
        👋 Hi! I’m your AI Library Assistant. How can I help you today?
      </div>
      <div id="suggestionChips" class="suggestion-chips"></div>
    </main>

    <button type="button" id="scrollToLatest" class="scroll-to-latest" hidden aria-label="Scroll to latest message">
      ↓ New messages
    </button>

    <footer>
      <textarea id="userInput" placeholder="Type your question here..." aria-label="Type your question"></textarea>
      <button id="sendBtn" aria-label="Send message">Send</button>
    </footer>
  </div>

    <script src="./config.js"></script>
    <script src="./script.js"></script>
  
</body>
</html>
