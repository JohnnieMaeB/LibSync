[project]
name = "libsync-backend"
version = "1.0.0"
description = "LibSync AI library assistant backend (FastAPI + pydantic-ai)"
requires-python = ">=3.11"
dependencies = [
    # Upper-bounded below 0.137: FastAPI 0.137+ wraps app.include_router()
    # routes in a new _IncludedRouter type that opentelemetry-instrumentation-fastapi
    # 0.63b1 (the version logfire[fastapi]>=4.37.0 currently resolves to)
    # can't read .path off, 500-ing every CORS preflight request whenever
    # LOGFIRE_TOKEN is set. Lift this once logfire ships a release compatible
    # with opentelemetry-instrumentation-fastapi>=0.64b0 (which fixes this).
    "fastapi>=0.115,<0.137",
    "uvicorn[standard]>=0.30",
    "pydantic-ai-slim[ag-ui,groq,huggingface]>=1.0.8",
    "pinecone>=7.0",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "logfire[fastapi]>=4.37.0",
    "citeproc-py>=0.10.1",
    "citeproc-py-styles>=0.1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
