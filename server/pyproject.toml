[project]
name = "libsync-backend"
version = "1.0.0"
description = "LibSync AI library assistant backend (FastAPI + pydantic-ai)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-ai-slim[ag-ui,groq,huggingface]>=1.0.8",
    "pinecone>=7.0",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "logfire[fastapi]>=5.2.0",
    "citeproc-py>=0.10.1",
    "citeproc-py-styles>=0.1.6",
]

[dependency-groups]
dev = [
    "pydantic-evals>=2.6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
