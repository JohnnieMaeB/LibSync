[project]
name = "libsync-backend"
version = "1.0.0"
description = "LibSync AI library assistant backend (FastAPI + pydantic-ai)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-ai-slim[huggingface,groq]>=1.0.8",
    "pinecone>=7.0",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "logfire[fastapi]>=4.37.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
