name: Keep-Alive Ping

# Free-tier watchdog, not a functional requirement: Pinecone Starter indexes
# pause after 3 weeks idle, and Render's free instance sleeps after 15 min
# idle (a weekly ping can't prevent that, but it does surface if the service
# is unreachable). Runs weekly so both stay within the budget ledger in
# TIER1_PLAN.md without manual checking.
on:
  schedule:
    - cron: "0 12 * * 1" # Every Monday at 12:00 UTC
  workflow_dispatch:

jobs:
  # Free Supabase projects pause after a week without activity (Tier 8). Skips
  # cleanly until the dashboard is configured.
  ping-supabase:
    runs-on: ubuntu-24.04
    steps:
      - name: Query Supabase to keep the project active
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "Supabase not configured; skipping."; exit 0; fi
          curl -sf --max-time 30 -H "apikey: $SUPABASE_KEY" "$SUPABASE_URL/rest/v1/libraries?select=id&limit=1" > /dev/null             && echo "Supabase is reachable."             || echo "::warning::Supabase did not respond — check the project in the Supabase dashboard."

  ping-render:
    runs-on: ubuntu-24.04
    steps:
      - name: Ping Render backend
        run: |
          curl -sf --max-time 60 https://libsync.onrender.com/docs > /dev/null \
            && echo "Render backend is reachable." \
            || echo "::warning::Render backend did not respond within 60s (may be cold-starting, or may be down — check the Render dashboard)."

  ping-pinecone:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --locked
        working-directory: ./pinecone-scripts

      - name: Query Pinecone index to keep it alive
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: uv run python test_pinecone_records.py
        working-directory: ./pinecone-scripts
