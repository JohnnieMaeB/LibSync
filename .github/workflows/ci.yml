name: Run Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  client-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./app

      - name: Run tests
        run: npm test
        working-directory: ./app

      - name: Build app/ (sanity check)
        run: npm run build
        working-directory: ./app

      # Real-browser WCAG 2.1 AA checks (axe-core via Playwright) against the
      # build above, with the backend mocked: catches what jsdom can't, such
      # as color contrast. See app/e2e/a11y.spec.ts.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: ./app

      - name: Accessibility checks (Playwright + axe)
        run: npm run test:e2e
        working-directory: ./app

  site-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./site

      - name: Run tests
        run: npm test
        working-directory: ./site

      - name: Build blog (sanity check)
        run: npm run build
        working-directory: ./site

  server-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --locked
        working-directory: ./server

      - name: Run tests
        run: uv run pytest
        working-directory: ./server
