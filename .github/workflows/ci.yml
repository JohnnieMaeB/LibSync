name: Run Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  client-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./app

      - name: Run tests
        run: npm test
        working-directory: ./app

      - name: Build app/
        run: npm run build
        working-directory: ./app

      - name: Verify docs/ is in sync with app/'s build output
        run: git diff --exit-code -- docs || (echo "::error::docs/ is out of sync with app/ — run 'npm run build' in app/ and commit the result." && exit 1)

  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --locked
        working-directory: ./server

      - name: Run tests
        run: uv run pytest
        working-directory: ./server
