name: Agent Evals

# Live behavioral evals (server/evals/) against the real Groq, Pinecone,
# Open Library, OpenAlex, and Crossref stack. Not part of ci.yml on purpose:
# they spend real free-tier quota and depend on third-party uptime, so they
# run weekly and on demand instead of on every push. A weekly run is also the
# early warning for provider-side breakage that unit tests can't see — e.g.
# a model id being retired upstream, which took every chat turn down at once.
on:
  schedule:
    # Every Monday at 08:00 UTC (early morning across US time zones): a full
    # run spends a large share of the primary model's 200k-token daily Groq
    # quota, which production shares, so it runs when patrons are fewest.
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      model:
        description: "Optional pydantic-ai model string to evaluate instead of the configured one (e.g. groq:qwen/qwen3.8-27b)"
        required: false
        default: ""
      cases:
        description: "Optional space-separated case names to run instead of the full suite (e.g. renewals late-fees)"
        required: false
        default: ""

jobs:
  evals:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --locked
        working-directory: ./server

      # HHEM-2.1-Open scores policy answers for faithfulness (evals/faithfulness.py).
      # Installed here only, never in production: CPU torch is far too big for
      # Render. Constrained to the lockfile so the app's own packages
      # (huggingface-hub in particular) stay at their locked versions.
      - name: Install the HHEM faithfulness scorer
        run: |
          uv export --frozen --no-hashes --no-emit-project > /tmp/constraints.txt
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install "transformers>=5,<6" --constraint /tmp/constraints.txt
        working-directory: ./server

      - name: Cache the HHEM model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hhem-de9a5e6ba9ba49531a022dba17e35ffeb2a6fad8

      - name: Run evals
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          HUGGINGFACE_TOKEN: ${{ secrets.HF_API_KEY }}
          MODEL: ${{ inputs.model }}
          CASES: ${{ inputs.cases }}
          PYTHONUNBUFFERED: "1"
        # --no-sync keeps the HHEM packages installed above.
        run: |
          case_args=()
          for name in $CASES; do case_args+=(--case "$name"); done
          uv run --no-sync python -m evals.run ${MODEL:+--model "$MODEL"} "${case_args[@]}"
        working-directory: ./server

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-results
          path: server/evals/results.json
          if-no-files-found: ignore
